<script>
  // Your Finnhub API Key
  const API_KEY = "jbck0g";

  // Your Portfolio Holdings
  const portfolio = [
    { ticker: "INTC", shares: 0.4007, cost: 48.00 },
    { ticker: "MU", shares: 0.0271, cost: 30.00 },
    { ticker: "NVDA", shares: 0.2594, cost: 50.00 },
    { ticker: "SNDK", shares: 0.0087, cost: 18.65 },
    { ticker: "SPCX", shares: 0.2346, cost: 43.00 } // Private company, remains static
  ];

  async function fetchLiveNasdaqPrices() {
    for (let holding of portfolio) {
      if (holding.ticker === "SPCX") continue;

      try {
        let response = await fetch(`https://finnhub.io/api/v1/quote?symbol=${holding.ticker}&token=${API_KEY}`);
        let data = await response.json();

        if (data && data.c) {
          let livePrice = data.c;
          let currentValue = holding.shares * livePrice;
          let pnl = currentValue - holding.cost;
          let pnlPercent = (pnl / holding.cost) * 100;

          console.log(`[NASDAQ Live] ${holding.ticker}: $${livePrice.toFixed(2)} | Value: $${currentValue.toFixed(2)} | P/L: ${pnlPercent.toFixed(2)}%`);
        }
      } catch (err) {
        console.error(`Failed to fetch live price for ${holding.ticker}:`, err);
      }
    }
  }

  // Fetch immediately on load, then update every 30 seconds
  fetchLiveNasdaqPrices();
  setInterval(fetchLiveNasdaqPrices, 30000);
const API_KEY = "jbck0g";
</script>
